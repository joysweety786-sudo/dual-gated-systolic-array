name: Systolic Array Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Icarus Verilog and Cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb cocotb-bus pytest numpy

      - name: Run Processing Element Simulation
        run: |
          cd phase3_verification
          make clean
          make