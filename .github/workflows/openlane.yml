name: OpenLane ASIC Hardening to GDSII

on:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane with Pre-installed Sky130 PDK
        uses: efabless/openlane-action@v1
        with:
          design_dir: openlane/systolic_array_4x4
          run_tag: gds_run

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systolic-array-gds-artifacts
          path: |
            openlane/systolic_array_4x4/runs/gds_run/results/final/gds/*.gds
            openlane/systolic_array_4x4/runs/gds_run/reports/metrics.csv