name: OpenLane ASIC Hardening to GDSII

on:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenLane and Sky130 PDK
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib
          
          # Clone the specific stable v1 version (2023.11.23) instead of unstable master
          git clone --depth 1 --branch 2023.11.23 https://github.com/The-OpenROAD-Project/OpenLane.git ~/OpenLane
          cd ~/OpenLane
          
          # Pull the exact Docker image required for this specific OpenLane version
          make pull-openlane
          
          # Auto-download the correct Sky130 PDK using built-in Volare
          make pdk

      - name: Run OpenLane Hardening
        run: |
          cd ~/OpenLane
          # The OpenLane wrapper script automatically handles all Docker mounts
          ./flow.tcl -design $GITHUB_WORKSPACE/openlane/systolic_array_4x4 -tag gds_run -overwrite

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systolic-array-gds-artifacts
          path: |
            openlane/systolic_array_4x4/runs/gds_run/results/final/gds/*.gds
            openlane/systolic_array_4x4/runs/gds_run/reports/metrics.csv