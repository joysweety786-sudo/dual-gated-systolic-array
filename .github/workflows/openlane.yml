name: OpenLane ASIC Hardening to GDSII

on:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane Flow via IIC-OSIC
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE:/workspace \
            -w /workspace \
            hpretl/iic-osic-tools:latest \
            -s bash -c "FLOW_PATH=\$(find / -name flow.tcl 2>/dev/null | head -n 1); echo \"Found flow.tcl at \$FLOW_PATH\"; \$FLOW_PATH -design /workspace/openlane/systolic_array_4x4 -tag gds_run -overwrite"

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systolic-array-gds-artifacts
          path: |
            openlane/systolic_array_4x4/runs/gds_run/results/final/gds/*.gds
            openlane/systolic_array_4x4/runs/gds_run/reports/metrics.csv