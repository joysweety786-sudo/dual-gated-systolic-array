name: OpenLane ASIC Hardening to GDSII

on:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    # This natively runs the entire job INSIDE the ASIC container
    container:
      image: hpretl/iic-osic-tools:latest
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane Hardening
        run: |
          # Set explicit PDK paths and run the TCL flow directly
          export PDK_ROOT=/foss/pdks
          export PDK=sky130A
          /foss/tools/openlane/flow.tcl -design openlane/systolic_array_4x4 -tag gds_run -overwrite

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systolic-array-gds-artifacts
          path: |
            openlane/systolic_array_4x4/runs/gds_run/results/final/gds/*.gds
            openlane/systolic_array_4x4/runs/gds_run/reports/metrics.csv