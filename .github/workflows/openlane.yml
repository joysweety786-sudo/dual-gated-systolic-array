name: OpenLane ASIC Hardening to GDSII

on:
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane and Sky130 PDK
        run: |
          pip install --upgrade pip
          pip install openlane volare
          volare enable --pdk sky130 $(volare ls-remote --pdk sky130 | head -n 1)

      - name: Run OpenLane Hardening
        run: |
          openlane openlane/systolic_array_4x4/config.json --run-tag gds_run

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systolic-array-gds-artifacts
          path: |
            openlane/systolic_array_4x4/runs/gds_run/final/gds/*.gds
            openlane/systolic_array_4x4/runs/gds_run/reports/metrics.csv